<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordem de serviço - MecOn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .os-tabela { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 0.92rem; }
        .os-tabela th, .os-tabela td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--borda); }
        .os-tabela th { font-size: 0.8rem; color: var(--texto-secundario); }
        .os-tabela td.num, .os-tabela th.num { text-align: right; white-space: nowrap; }
        .os-bloco { margin-bottom: 18px; }
        .os-bloco h3 { margin: 0 0 6px; font-size: 1rem; }
        .os-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 24px; font-size: 0.92rem; }
        @media print {
            .header, .footer, .no-print { display: none !important; }
            body { background: #fff; }
            .main { padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="../index.html" class="header__logo-link" aria-label="MecOn - Página inicial">
            <img src="../img/logo.png" alt="MecOn" class="header__logo">
        </a>
        <nav class="header__acoes" id="header-acoes"></nav>
    </header>
    <main class="main" style="max-width: 820px;">
        <div class="no-print" style="display:flex; justify-content:space-between; gap:10px; margin-bottom:16px;">
            <a href="#" id="link-voltar" class="link-auxiliar" style="text-align:left;">&larr; Voltar</a>
            <button type="button" id="botao-imprimir" class="botao botao--secundario">Imprimir</button>
        </div>
        <div id="conteudo-os"><p>Carregando…</p></div>
    </main>
    <footer class="footer">
        <p class="footer__copyright">2026 © MecOn. Todos os direitos reservados</p>
        <p class="footer__legal"><a href="privacidade.html">Política de Privacidade</a> · <a href="termos.html">Termos de Uso</a></p>
    </footer>
    <script src="../js/auth.js"></script>
    <script src="../js/ordem-servico.js"></script>
</body>
</html>
