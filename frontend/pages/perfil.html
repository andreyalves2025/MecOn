            <button class="perfil-aba" data-aba="comentarios" role="tab" aria-selected="false">Comentários
                feitos</button>
            <button class="perfil-aba" data-aba="conta" role="tab" aria-selected="false">Dados da conta</button>
        </nav>
        <section id="painel-abas">
            <!-- Conteúdo de cada aba renderizado dinamicamente por perfil.js -->
