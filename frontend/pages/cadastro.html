<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - MecOn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="header__logo-link" aria-label="MecOn - Página inicial">
            <!-- TODO: substituir pelo arquivo de logo (PNG/SVG) quando disponível -->
            <img src="../img/logo.png" alt="MecOn" class="header__logo">
        </a>
        <nav class="header__acoes" id="header-acoes"></nav>
    </header>
    <main class="main">
        <div class="cartao-formulario">
            <h2 style="text-align:center; margin-bottom: 24px;">Criar conta</h2>
            <p id="erro-cadastro" class="mensagem-erro"></p>
            <form id="form-cadastro">
                <div class="campo-formulario">
                    <label for="input-nome">Nome</label>
                    <input type="text" id="input-nome" required autocomplete="name">
                </div>
                <div class="campo-formulario">
                    <label for="input-email">Email</label>
                    <input type="email" id="input-email" required autocomplete="email">
                </div>
                <div class="campo-formulario">
                    <label for="input-senha">Senha</label>
                    <input type="password" id="input-senha" required minlength="6" autocomplete="new-password">
                </div>
                <div class="campo-formulario campo-formulario--aceite">
                    <label for="input-aceite" style="display:flex; gap:8px; align-items:flex-start; font-size:0.9rem; font-weight:400;">
                        <input type="checkbox" id="input-aceite" required style="margin-top:3px;">
                        <span>Li e aceito os <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a
                            <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>,
                            inclusive o tratamento da placa e dos dados do meu veículo para as finalidades descritas.</span>
                    </label>
                </div>
                <button type="submit" class="botao botao--primario botao--largura-total">Cadastrar</button>
            </form>
            <p style="text-align:center; margin-top: 20px; font-size: 0.9rem;">
                Já tem conta? <a href="login.html" id="link-login">Fazer login</a>
            </p>
        </div>
    </main>
    <footer class="footer">
        <div class="footer__redes">

                </svg>
            </a>
            <a href="#" aria-label="MecOn no Instagram">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12 2.2c3.2 0 3.6 0 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.25.07 1.65.07 4.85s0 3.6-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.25.06-1.65.07-4.85.07s-3.6 0-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92C2.07 15.6 2.06 15.2 2.06 12s0-3.6.07-4.85C2.28 3.93 3.8 2.38 7.05 2.27 8.3 2.21 8.7 2.2 12 2.2zm0 1.8c-3.14 0-3.51 0-4.74.07-2.27.1-3.39 1.24-3.49 3.49C3.7 8.49 3.7 8.86 3.7 12s0 3.51.07 4.74c.1 2.25 1.22 3.39 3.49 3.49 1.23.06 1.6.07 4.74.07s3.51 0 4.74-.07c2.26-.1 3.39-1.23 3.49-3.49.06-1.23.07-1.6.07-4.74s0-3.51-.07-4.74c-.1-2.25-1.23-3.39-3.49-3.49C15.51 4 15.14 4 12 4zm0 3.05a4.95 4.95 0 110 9.9 4.95 4.95 0 010-9.9zm0 8.17a3.22 3.22 0 100-6.44 3.22 3.22 0 000 6.44zm6.3-8.36a1.16 1.16 0 11-2.32 0 1.16 1.16 0 012.32 0z" />

        <p class="footer__copyright">2026 © MecOn. Todos os direitos reservados</p>
        <p class="footer__legal"><a href="privacidade.html">Política de Privacidade</a> · <a href="termos.html">Termos de Uso</a></p>
        <a href="#" class="footer__contato">Fale Conosco</a>
    </footer>
    <script src="../js/auth.js"></script>
    <script>
        // Propaga o parâmetro de retorno para a tela de login, caso o usuário
        // já tenha conta e prefira entrar em vez de se cadastrar.
        (function propagarRetornoParaLogin() {
            const params = new URLSearchParams(window.location.search);
            const retorno = params.get('retorno');
            if (retorno) {
                const linkLogin = document.getElementById('link-login');
                linkLogin.href = `login.html?retorno=${encodeURIComponent(retorno)}`;
            }
        })();
        document.getElementById('form-cadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const nome = document.getElementById('input-nome').value.trim();
            const email = document.getElementById('input-email').value.trim();
            const senha = document.getElementById('input-senha').value;
            const erroEl = document.getElementById('erro-cadastro');
            erroEl.classList.remove('mensagem-erro--visivel');
            try {
                const resposta = await chamarApi('/auth/register.php', {
                    method: 'POST',
                    body: JSON.stringify({ nome, email, senha, aceite_termos: document.getElementById('input-aceite').checked }),
                });
                salvarUsuarioLocal(resposta.usuario);
                if (resposta.debug_link_verificacao) {
                    // MODO DEV: sem servidor de email configurado, o link de
                    // verificação vem na própria resposta só para permitir
                    // testar o fluxo. Isso NUNCA deve existir em produção
                    // (ver aviso em backend/config/email.php).
                    console.info('[MecOn - modo dev] Link de verificação de email:', resposta.debug_link_verificacao);
                    alert(
                        'Cadastro realizado! Em produção você receberia um email de confirmação.\n\n' +
                        'Modo de desenvolvimento — link de verificação (também no console):\n' +
                        resposta.debug_link_verificacao
                    );
                }
                const params = new URLSearchParams(window.location.search);
                const retorno = params.get('retorno');
                if (retorno) {
                    window.location.href = decodeURIComponent(retorno);
                } else {
                    window.location.href = 'perfil.html';
                }
            } catch (erro) {
                erroEl.textContent = erro.message;
                erroEl.classList.add('mensagem-erro--visivel');
            }
        });
    </script>
</body>
</html>
