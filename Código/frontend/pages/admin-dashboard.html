<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MecOn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .grade-metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 20px 0 32px; }
        @media (max-width: 720px) { .grade-metricas { grid-template-columns: repeat(2, 1fr); } }
        .cartao-metrica span { display: block; margin-top: 4px; }
        .main h2 { margin: 28px 0 14px; }
        .cartao-metrica { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio-botao); padding: 16px; text-align: center; }
        .cartao-metrica strong { display: block; font-size: 1.8rem; font-family: var(--fonte-titulo); color: var(--azul-mecon); }
        .cartao-metrica span { font-size: 0.85rem; color: var(--texto-secundario); }
        .tabela-comparar th, .tabela-comparar td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--borda); }
        .tabela-comparar th { background: #F7F7F9; font-size: 0.85rem; color: var(--texto-secundario); }
    </style>
</head>
<body>
    <header class="header">
        <a href="../index.html" class="header__logo-link" aria-label="MecOn - Página inicial">
            <img src="../img/logo.png" alt="MecOn" class="header__logo">
        </a>
        <nav class="header__acoes" id="header-acoes"></nav>
    </header>
    <main class="main">
        <a href="admin.html" class="link-auxiliar" style="text-align:left; margin-bottom: 16px;">&larr; Voltar ao painel</a>
        <h1>Dashboard</h1>
        <div id="conteudo-dashboard">
            <p>Carregando métricas…</p>
        </div>
    </main>
    <footer class="footer">
        <p class="footer__copyright">2026 © MecOn. Todos os direitos reservados</p>
        <p class="footer__legal"><a href="privacidade.html">Política de Privacidade</a> · <a href="termos.html">Termos de Uso</a></p>
    </footer>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
